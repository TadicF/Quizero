<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizero</title>
</head>
<body id="mainBody">
    <header id="mainHeader">
        <div class="profileContainer">
            <img src="./assets/icons/profilePfp.svg" alt="Profile Picture" width="35px" height="35px">
            <p class="profileName signUp">Sign Up</p>
        </div>
        <div class="appTitle">
            <img src="./assets/icons/appIcon.svg" alt="App Icon" width="75px" height="75px">
            <p>Quizero</p>
        </div>

        <div class="optionsSection">
            <img src="./assets/icons/options.svg" alt="Options Icon" width="35px" height="35px">
        </div>
    </header>
    <main id="mainMenu">
        <div class="selectorContainer">
            <button class="customQuestions">
                <p>Custom</p>
                <div>
                    <img src="./assets/icons/gear.svg" alt="" width="25px" height="25px">
                    <p>Use your own questions</p>
                </div>
            </button>
            <button class="defaultQuestions">
                <p>Default</p>
                <div>
                    <img src="./assets/icons/package.svg" alt="" width="25px" height="25px">
                    <p>Use the app's built-in questions</p>
                </div>
            </button>
        </div>
    </main>
    <footer id="mainFooter">
        <div>
            <p>Made by <a href="https://github.com/TadicF" target="_blank">TadicF</a></p>
            <img src="./assets/icons/brand-github.svg" alt="GitHub Icon" width="25px" height="25px">
        </div>
    </footer>
</body>
</html>
